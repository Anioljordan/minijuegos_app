
# Cubo — Flutter iOS → App Store Connect / TestFlight

workflows:
  ios-release:
    name: Cubo iOS → App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: cubo

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anioldev.cubo

      vars:
        APP_STORE_APPLE_ID: 6793448087

      # Firebase: descomentar si utilizas Firebase
      # groups:
      #   - firebase

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true

    scripts:
      # Firebase: descomentar si utilizas Firebase
      # - name: Añadir GoogleService-Info.plist
      #   script: |
      #     printf '%s' "$IOS_FIREBASE_CONFIG" | base64 -D > ios/Runner/GoogleService-Info.plist

      - name: Dependencias de Flutter
        script: |
          flutter pub get

      - name: Configurar firma de Apple
        script: |
          xcode-project use-profiles

      # No ejecutar pod install manualmente.
      # Flutter 3.44+ gestiona Swift Package Manager automáticamente.

      - name: Compilar IPA
        script: |
          # Número de build = fecha/hora UTC (AADDDHHMM, p. ej. 263211728).
          # Siempre es mayor que el anterior y nunca se repite, sin depender
          # de la API de Apple.
          NEXT_BUILD=$(date -u +%y%j%H%M)
          echo "Build number: $NEXT_BUILD"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$NEXT_BUILD \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - anioljolo@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
