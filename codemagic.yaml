
# Cubo — Flutter iOS → App Store Connect / TestFlight

workflows:
  ios-release:
    name: Cubo iOS → App Store
    instance_type: mac_mini_m2
    max_build_duration: 60

    integrations:
      app_store_connect: cubo

    environment:
      flutter: stable
      xcode: latest
      cocoapods: default

      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.anioldev.cubo

      vars:
        APP_STORE_APPLE_ID: 6793448087

      # Firebase: descomentar si utilizas Firebase
      # groups:
      #   - firebase

    triggering:
      events:
        - push
      branch_patterns:
        - pattern: master
          include: true
      cancel_previous_builds: true

    scripts:
      # Firebase: descomentar si utilizas Firebase
      # - name: Añadir GoogleService-Info.plist
      #   script: |
      #     printf '%s' "$IOS_FIREBASE_CONFIG" | base64 -D > ios/Runner/GoogleService-Info.plist

      - name: Dependencias de Flutter
        script: |
          flutter pub get

      - name: Configurar firma de Apple
        script: |
          xcode-project use-profiles

      # No ejecutar pod install manualmente.
      # Flutter 3.44+ gestiona Swift Package Manager automáticamente.

      - name: Compilar IPA
        script: |
          # Apple no acepta números de build repetidos: se usa el mayor entre
          # TestFlight y App Store + 1. Si la API falla, se usa la fecha/hora
          # (siempre creciente y nunca repetida).
          TF=$(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -dc '0-9')
          AS=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID" 2>/dev/null | tail -1 | tr -dc '0-9')
          echo "Último build TestFlight: ${TF:-?} · App Store: ${AS:-?}"
          TF=${TF:-0}; AS=${AS:-0}
          LATEST=$(( TF > AS ? TF : AS ))
          if [ "$LATEST" -gt 0 ]; then
            NEXT_BUILD=$((LATEST + 1))
          else
            NEXT_BUILD=$(date -u +%y%j%H%M)
          fi
          echo "Build number: $NEXT_BUILD"
          flutter build ipa --release \
            --build-name=1.0.0 \
            --build-number=$NEXT_BUILD \
            --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      email:
        recipients:
          - anioljolo@gmail.com
        notify:
          success: true
          failure: true

      app_store_connect:
        auth: integration
        submit_to_testflight: true
        submit_to_app_store: false
